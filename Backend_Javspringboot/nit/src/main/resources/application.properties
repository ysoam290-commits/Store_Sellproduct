
spring.application.name=nit

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/Products
spring.datasource.username=mac
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# Gmail SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Frontend URL
app.frontend.url=http://localhost:5173

# Password Reset
app.password-reset.dev-mode=false

# Sender Email
app.mail.from=${MAIL_USERNAME:}
app.jwt.secret=${APP_JWT_SECRET:CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_123456789}


logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web=DEBUG


# ==========================================
# ABA PAYWAY - SANDBOX CONFIGURATION
# ==========================================

# Merchant credentials
aba.payway.merchant-id=${ABA_MERCHANT_ID}
aba.payway.api-key=${ABA_API_KEY}

# Purchase / Hosted Checkout API
aba.payway.purchase-url=${ABA_PURCHASE_URL:https://checkout-sandbox.payway.com.kh/api/payment-gateway/v1/payments/purchase}

# KHQR Generate API
aba.payway.qr-url=${ABA_QR_URL:https://checkout-sandbox.payway.com.kh/api/payment-gateway/v1/payments/generate-qr}

# Check Transaction API
aba.payway.check-transaction-url=${ABA_CHECK_TRANSACTION_URL:https://checkout-sandbox.payway.com.kh/api/payment-gateway/v1/payments/check-transaction-2}

# Callback URL
# Must be publicly accessible by ABA when testing callbacks
aba.payway.callback-url=${ABA_CALLBACK_URL:}

# Currency
aba.payway.currency=${ABA_CURRENCY:USD}
